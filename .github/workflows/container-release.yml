name: Container Release

on:
  workflow_call:
    inputs:
      aws_region:
        description: AWS region used for ECR and S3
        required: true
        type: string

      aws_role_arn:
        description: IAM role assumed through GitHub OIDC
        required: true
        type: string

      ecr_repository:
        description: Amazon ECR repository name
        required: true
        type: string

      s3_bucket:
        description: S3 bucket containing security evidence
        required: true
        type: string


jobs:
  release:
    name: Validate and publish
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout main commit
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Define release version
        shell: bash
        run: |
          VERSION="v0.1.${GITHUB_RUN_NUMBER}"

          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"

          echo "Release version: ${VERSION}"
          echo "Commit: ${GITHUB_SHA}"

      - name: Validate merged application
        id: audit
        uses: Alexander-FB/tfm-alexander-security-pipeline/.github/actions/container-security@main
        with:
          phase: baseline

      - name: Reject non-compliant main
        shell: bash
        env:
          REMEDIATION_REQUIRED: ${{ steps.audit.outputs.remediation_required }}
        run: |
          echo "Remediation required: ${REMEDIATION_REQUIRED}"

          if [ "${REMEDIATION_REQUIRED}" != "false" ]; then
            echo
            echo "ERROR: main does not satisfy the central security policy."
            echo "The release will not modify main automatically."
            echo "Create a pull request containing the required remediation."
            exit 1
          fi

          echo "Merged commit satisfies the central security policy."

      - name: Prepare final release evidence
        shell: bash
        run: |
          rm -rf results/hardened
          cp -a results/baseline results/hardened

      - name: Evaluate final release gate
        uses: Alexander-FB/tfm-alexander-security-pipeline/.github/actions/container-security@main
        with:
          phase: report

      - name: Configure AWS credentials through OIDC
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: ${{ inputs.aws_role_arn }}
          aws-region: ${{ inputs.aws_region }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2.1.6

      - name: Publish validated application image
        shell: bash
        env:
          ECR_REGISTRY: ${{ steps.ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ inputs.ecr_repository }}
          AWS_REGION: ${{ inputs.aws_region }}
        run: |
          IMAGE_URI="${ECR_REGISTRY}/${ECR_REPOSITORY}:${VERSION}"

          echo "Release version: ${VERSION}"
          echo "Image: ${IMAGE_URI}"

          if aws ecr describe-images \
            --region "${AWS_REGION}" \
            --repository-name "${ECR_REPOSITORY}" \
            --image-ids imageTag="${VERSION}" \
            > /dev/null 2>&1
          then
            echo "Image ${VERSION} already exists in ECR."
            echo "This appears to be a workflow re-run; skipping duplicate push."
          else
            docker tag \
              tfm-api:baseline \
              "${IMAGE_URI}"

            docker push \
              "${IMAGE_URI}"
          fi

          echo "IMAGE_URI=${IMAGE_URI}" >> "$GITHUB_ENV"

      - name: Create release metadata
        shell: bash
        run: |
          cat > results/release-metadata.json <<JSON
          {
            "version": "${VERSION}",
            "commit": "${GITHUB_SHA}",
            "repository": "${GITHUB_REPOSITORY}",
            "image": "${IMAGE_URI}"
          }
          JSON

          echo "Release metadata:"
          cat results/release-metadata.json

      - name: Store GitHub release evidence
        uses: actions/upload-artifact@v7
        with:
          name: release-security-evidence-${{ github.run_number }}
          path: results/
          if-no-files-found: error
          retention-days: 30

      - name: Publish security evidence to S3
        shell: bash
        env:
          S3_BUCKET: ${{ inputs.s3_bucket }}
        run: |
          DESTINATION="s3://${S3_BUCKET}/releases/${VERSION}/"

          echo "Publishing security evidence:"
          echo "${DESTINATION}"

          aws s3 cp \
            results/ \
            "${DESTINATION}" \
            --recursive \
            --only-show-errors

      - name: Release summary
        shell: bash
        env:
          S3_BUCKET: ${{ inputs.s3_bucket }}
        run: |
          {
            echo "# 🚀 Container release"
            echo
            echo "## ✅ Release ${VERSION}"
            echo
            echo "| Artifact | Destination |"
            echo "|---|---|"
            echo "| Version | \`${VERSION}\` |"
            echo "| Container image | \`${IMAGE_URI}\` |"
            echo "| Security evidence | \`s3://${S3_BUCKET}/releases/${VERSION}/\` |"
            echo "| Git commit | \`${GITHUB_SHA}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
