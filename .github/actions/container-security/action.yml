name: Security Engine
description: Executes individual phases of the container security pipeline

inputs:
  phase:
    description: Pipeline phase to execute
    required: true

outputs:
  remediation_required:
    description: Whether the audited baseline requires automated hardening
    value: ${{ steps.assess.outputs.remediation_required }}

runs:
  using: composite

  steps:
    - name: Validate requested phase
      shell: bash
      run: |
        case "${{ inputs.phase }}" in
          baseline|remediate|hardened|report)
            echo "Executing phase: ${{ inputs.phase }}"
            ;;
          *)
            echo "Unsupported security phase: ${{ inputs.phase }}"
            exit 1
            ;;
        esac

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: "3.13"

    - name: Install engine dependencies
      shell: bash
      run: |
        python -m pip install \
          --disable-pip-version-check \
          -r "$GITHUB_ACTION_PATH/requirements.txt"

    # ================================================================
    # SCANNER SETUP
    # ================================================================

    - name: Install Syft
      if: ${{ inputs.phase == 'baseline' || inputs.phase == 'hardened' }}
      id: syft
      uses: anchore/sbom-action/download-syft@v0.24.0
      with:
        syft-version: v1.50.0

    - name: Add Syft to PATH
      if: ${{ inputs.phase == 'baseline' || inputs.phase == 'hardened' }}
      shell: bash
      run: |
        echo "$(dirname '${{ steps.syft.outputs.cmd }}')" >> "$GITHUB_PATH"

    - name: Install Trivy
      if: ${{ inputs.phase == 'baseline' || inputs.phase == 'hardened' }}
      uses: aquasecurity/setup-trivy@e07451d2e059ed86c2870430ea286b3a9e0bf241
      with:
        version: v0.72.0
        cache: true

    # ================================================================
    # BASELINE
    # ================================================================

    - name: Prepare baseline evidence
      if: ${{ inputs.phase == 'baseline' }}
      shell: bash
      run: |
        rm -rf results/baseline
        mkdir -p results/baseline

    - name: Build baseline image
      if: ${{ inputs.phase == 'baseline' }}
      shell: bash
      run: |
        compose_image="$(
          docker compose config --format json \
            | jq -r '.services.api.image'
        )"

        if [ -z "$compose_image" ] || [ "$compose_image" = "null" ]; then
          echo "Unable to determine API image from Docker Compose."
          exit 1
        fi

        echo "Compose expects API image: $compose_image"

        docker build \
          -t tfm-api:baseline \
          -t "$compose_image" \
          ./app
          
    - name: Generate baseline SBOM
      if: ${{ inputs.phase == 'baseline' }}
      shell: bash
      run: |
        syft tfm-api:baseline \
          -o spdx-json=results/baseline/sbom.spdx.json

    - name: Scan baseline vulnerabilities
      if: ${{ inputs.phase == 'baseline' }}
      shell: bash
      run: |
        trivy image \
          --scanners vuln \
          --format json \
          --output results/baseline/trivy-image.json \
          tfm-api:baseline

    - name: Scan baseline configuration
      if: ${{ inputs.phase == 'baseline' }}
      shell: bash
      run: |
        trivy config \
          --format json \
          --output results/baseline/trivy-config.json \
          .

    - name: Lint baseline Compose
      if: ${{ inputs.phase == 'baseline' }}
      shell: bash
      run: |
        set +e

        docker run --rm \
          -v "$GITHUB_WORKSPACE:/app" \
          zavoloklom/dclint:3.1.0 \
          /app/docker-compose.yml \
          > results/baseline/dclint.txt 2>&1

        exit_code=$?

        set -e

        if [ "$exit_code" -eq 0 ]; then
          echo "DCLINT_RESULT=PASS" >> results/baseline/dclint.txt
        else
          echo "DCLINT_RESULT=FAIL" >> results/baseline/dclint.txt
        fi

        echo "DCLint baseline exit code: $exit_code"

    - name: Start baseline environment
      if: ${{ inputs.phase == 'baseline' }}
      shell: bash
      run: |
        docker compose down \
          -v \
          --remove-orphans || true

        docker compose up \
          -d \
          --no-build

        for attempt in $(seq 1 30); do
          if curl \
            --silent \
            --fail \
            http://localhost:8080/health \
            > /dev/null; then
            echo "Baseline application ready."
            break
          fi

          sleep 2
        done

    - name: Validate baseline runtime
      if: ${{ inputs.phase == 'baseline' }}
      shell: bash
      run: |
        python \
          "$GITHUB_ACTION_PATH/scripts/runtime_checks.py" \
          --variant baseline

    - name: Stop baseline environment
      if: ${{ inputs.phase == 'baseline' && always() }}
      shell: bash
      run: |
        docker compose down \
          -v \
          --remove-orphans || true

    - name: Evaluate baseline compliance
      if: ${{ inputs.phase == 'baseline' }}
      id: assess
      shell: bash
      env:
        CONTAINER_SECURITY_POLICY: ${{ github.action_path }}/policy/container-security-policy.yml
      run: |
        python \
          "$GITHUB_ACTION_PATH/scripts/assess.py"

    # ================================================================
    # REMEDIATION
    # ================================================================

    - name: Apply central security policy
      if: ${{ inputs.phase == 'remediate' }}
      shell: bash
      env:
        CONTAINER_SECURITY_POLICY: ${{ github.action_path }}/policy/container-security-policy.yml
      run: |
        python \
          "$GITHUB_ACTION_PATH/scripts/remediate.py"

    # ================================================================
    # HARDENED
    # ================================================================

    - name: Prepare hardened evidence
      if: ${{ inputs.phase == 'hardened' }}
      shell: bash
      run: |
        rm -rf results/hardened
        mkdir -p results/hardened

    - name: Build hardened image
      if: ${{ inputs.phase == 'hardened' }}
      shell: bash
      run: |
        docker build \
          -t tfm-api:hardened \
          ./app

    - name: Generate hardened SBOM
      if: ${{ inputs.phase == 'hardened' }}
      shell: bash
      run: |
        syft tfm-api:hardened \
          -o spdx-json=results/hardened/sbom.spdx.json

    - name: Scan hardened vulnerabilities
      if: ${{ inputs.phase == 'hardened' }}
      shell: bash
      run: |
        trivy image \
          --scanners vuln \
          --format json \
          --output results/hardened/trivy-image.json \
          tfm-api:hardened

    - name: Scan hardened configuration
      if: ${{ inputs.phase == 'hardened' }}
      shell: bash
      run: |
        trivy config \
          --format json \
          --output results/hardened/trivy-config.json \
          .

    - name: Lint hardened Compose
      if: ${{ inputs.phase == 'hardened' }}
      shell: bash
      run: |
        set +e

        docker run --rm \
          -v "$GITHUB_WORKSPACE:/app" \
          zavoloklom/dclint:3.1.0 \
          /app/docker-compose.yml \
          > results/hardened/dclint.txt 2>&1

        exit_code=$?

        set -e

        if [ "$exit_code" -eq 0 ]; then
          echo "DCLINT_RESULT=PASS" >> results/hardened/dclint.txt
        else
          echo "DCLINT_RESULT=FAIL" >> results/hardened/dclint.txt
        fi

        echo "DCLint hardened exit code: $exit_code"Build baseline image

    - name: Start hardened environment
      if: ${{ inputs.phase == 'hardened' }}
      shell: bash
      run: |
        docker compose down \
          -v \
          --remove-orphans || true

        docker compose up -d

        for attempt in $(seq 1 30); do
          if curl \
            --silent \
            --fail \
            http://localhost:8080/health \
            > /dev/null; then
            echo "Hardened application ready."
            break
          fi

          sleep 2
        done

    - name: Validate hardened runtime
      if: ${{ inputs.phase == 'hardened' }}
      shell: bash
      run: |
        python \
          "$GITHUB_ACTION_PATH/scripts/runtime_checks.py" \
          --variant hardened

    - name: Stop hardened environment
      if: ${{ inputs.phase == 'hardened' && always() }}
      shell: bash
      run: |
        docker compose down \
          -v \
          --remove-orphans || true

    # ================================================================
    # REPORT + GATE
    # ================================================================

    - name: Generate comparison and evaluate policy
      if: ${{ inputs.phase == 'report' }}
      shell: bash
      env:
        CONTAINER_SECURITY_POLICY: ${{ github.action_path }}/policy/container-security-policy.yml
      run: |
        python \
          "$GITHUB_ACTION_PATH/scripts/report.py"
