name: Container Security Engine
description: Audits, hardens, rebuilds and validates the container security laboratory

runs:
  using: composite

  steps:
    - name: Install engine Python dependencies
      shell: bash
      run: |
        python -m pip install \
          --disable-pip-version-check \
          -r "${{ github.action_path }}/requirements.txt"

    - name: Prepare evidence directories
      shell: bash
      run: |
        rm -rf results
        mkdir -p results/baseline
        mkdir -p results/hardened

    - name: Record tool versions
      shell: bash
      run: |
        {
          echo "Python: $(python --version)"
          echo "Syft: $(syft version | head -n 1)"
          echo "Trivy: $(trivy --version | head -n 1)"
          echo "DCLint: 3.1.0"
        } | tee results/tool-versions.txt

    # -----------------------------------------------------------------
    # BASELINE
    # -----------------------------------------------------------------

    - name: Build baseline image
      shell: bash
      run: |
        docker build \
          -t tfm-api:baseline \
          ./app

    - name: Generate baseline SBOM
      shell: bash
      run: |
        syft tfm-api:baseline \
          -o spdx-json=results/baseline/sbom.spdx.json

    - name: Scan baseline image vulnerabilities
      shell: bash
      run: |
        trivy image \
          --scanners vuln \
          --format json \
          --output results/baseline/trivy-image.json \
          tfm-api:baseline

    - name: Scan baseline configuration
      shell: bash
      run: |
        trivy config \
          --format json \
          --output results/baseline/trivy-config.json \
          .

    - name: Lint baseline Docker Compose
      shell: bash
      run: |
        docker run --rm \
          -v "$GITHUB_WORKSPACE:/app" \
          zavoloklom/dclint:3.1.0 \
          /app/docker-compose.yml \
          > results/baseline/dclint.txt 2>&1 || true

    - name: Start baseline environment
      shell: bash
      run: |
        docker compose down \
          -v \
          --remove-orphans || true

        docker compose up \
          -d \
          --no-build

        for attempt in $(seq 1 30); do
          if curl \
            --silent \
            --fail \
            http://localhost:8080/health \
            > /dev/null; then

            echo "Baseline application is ready."
            break
          fi

          sleep 2
        done

    - name: Validate baseline runtime
      shell: bash
      run: |
        python \
          "${{ github.action_path }}/scripts/runtime_checks.py" \
          --variant baseline

    - name: Stop baseline environment
      if: always()
      shell: bash
      run: |
        docker compose down \
          -v \
          --remove-orphans || true

    # -----------------------------------------------------------------
    # REMEDIATION
    # -----------------------------------------------------------------

    - name: Apply hardening policy
      shell: bash
      run: |
        python \
          "${{ github.action_path }}/scripts/remediate.py"

    # -----------------------------------------------------------------
    # HARDENED
    # -----------------------------------------------------------------

    - name: Build hardened image
      shell: bash
      run: |
        docker build \
          -t tfm-api:hardened \
          ./app

    - name: Generate hardened SBOM
      shell: bash
      run: |
        syft tfm-api:hardened \
          -o spdx-json=results/hardened/sbom.spdx.json

    - name: Scan hardened image vulnerabilities
      shell: bash
      run: |
        trivy image \
          --scanners vuln \
          --format json \
          --output results/hardened/trivy-image.json \
          tfm-api:hardened

    - name: Scan hardened configuration
      shell: bash
      run: |
        trivy config \
          --format json \
          --output results/hardened/trivy-config.json \
          .

    - name: Lint hardened Docker Compose
      shell: bash
      run: |
        docker run --rm \
          -v "$GITHUB_WORKSPACE:/app" \
          zavoloklom/dclint:3.1.0 \
          /app/docker-compose.yml \
          > results/hardened/dclint.txt 2>&1 || true

    - name: Start hardened environment
      shell: bash
      run: |
        docker compose down \
          -v \
          --remove-orphans || true

        docker compose up -d

        for attempt in $(seq 1 30); do
          if curl \
            --silent \
            --fail \
            http://localhost:8080/health \
            > /dev/null; then

            echo "Hardened application is ready."
            break
          fi

          sleep 2
        done

    - name: Validate hardened runtime
      shell: bash
      run: |
        python \
          "${{ github.action_path }}/scripts/runtime_checks.py" \
          --variant hardened

    - name: Stop hardened environment
      if: always()
      shell: bash
      run: |
        docker compose down \
          -v \
          --remove-orphans || true

    # -----------------------------------------------------------------
    # REPORT + GATE
    # -----------------------------------------------------------------

    - name: Generate comparison and evaluate gate
      shell: bash
      run: |
        python \
          "${{ github.action_path }}/scripts/report.py"
